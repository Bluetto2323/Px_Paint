# Builds the debug APK with the official Android SDK + NDK and publishes it as
# a downloadable workflow artifact. A second, independent job runs the
# engine's host test suites (same C++ sources) on Mesa GLES + lavapipe Vulkan.
#
# No secrets are used: the debug APK is signed with the debug key that the
# Android Gradle Plugin generates on the runner.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  BUILD_TOOLS_VERSION: "35.0.0"
  NDK_VERSION: "27.2.12479018"   # must match app/build.gradle.kts
  CMAKE_VERSION: "3.22.1"        # must match app/build.gradle.kts

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded source archive (only when the repo holds just the zip)
        # Phone-friendly bootstrap: if the repository contains only a source
        # .zip (uploaded from the GitHub website) instead of the project
        # tree, unpack it into the workspace. No-op for a normal checkout.
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ]; then
            archive=$(find . -maxdepth 1 -name '*.zip' | head -1)
            if [ -z "$archive" ]; then echo "No Gradle project and no source archive found" >&2; exit 1; fi
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$archive" -d "$RUNNER_TEMP/src"
            root=$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle.kts | head -1)")
            cp -a "$root"/. .
            chmod +x gradlew tools/ci/*.sh tools/host_test/*.sh
            echo "Building sources unpacked from $archive"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages (platform, build-tools, NDK, CMake)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Toolchain versions
        run: |
          java -version 2>&1 | head -1
          ./gradlew --version | grep -E "Gradle|Kotlin|JVM"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" --version | head -1
          grep Pkg.Revision "$ANDROID_NDK_HOME/source.properties"

      - name: Build debug APK (Kotlin + C++ for arm64-v8a and x86_64)
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode summary

      - name: PxPaint unit tests (JVM, JUnit 4)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: API-level lint (NewApi / InlinedApi, minSdk 26)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Inspect APK (ABIs, JNI exports, 16 KB alignment, Vulkan via dlopen, signature)
        run: |
          chmod +x tools/ci/inspect_apk.sh
          tools/ci/inspect_apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Name the APK after the commit
        id: name
        run: |
          short="${GITHUB_SHA::7}"
          out="PxPaint-block11-debug-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "artifact=PxPaint-debug-apk-${short}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/.cxx/**/*.log
            app/.cxx/**/CMakeOutput.log
            app/.cxx/**/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7

  host-tests:
    name: Engine host tests (Mesa GLES + lavapipe Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded source archive (only when the repo holds just the zip)
        # Phone-friendly bootstrap: if the repository contains only a source
        # .zip (uploaded from the GitHub website) instead of the project
        # tree, unpack it into the workspace. No-op for a normal checkout.
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ]; then
            archive=$(find . -maxdepth 1 -name '*.zip' | head -1)
            if [ -z "$archive" ]; then echo "No Gradle project and no source archive found" >&2; exit 1; fi
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$archive" -d "$RUNNER_TEMP/src"
            root=$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -name settings.gradle.kts | head -1)")
            cp -a "$root"/. .
            chmod +x gradlew tools/ci/*.sh tools/host_test/*.sh
            echo "Building sources unpacked from $archive"
          fi

      - name: Install compilers, Khronos headers and Mesa drivers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build clang \
            libvulkan-dev libegl-dev libgles-dev \
            libegl-mesa0 libgles2 mesa-vulkan-drivers > /dev/null
          ls /usr/share/vulkan/icd.d/

      - name: Run CPU suites + basic / lifecycle / faults / canvas / brush suites
        env:
          BUILD: ${{ github.workspace }}/build-host
        run: |
          set -euo pipefail
          # The lavapipe manifest name differs between distro releases
          # (lvp_icd.json, lvp_icd.x86_64.json): pick whichever exists.
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          if [ -z "$ICD" ]; then echo "lavapipe ICD not found" >&2; exit 1; fi
          echo "Vulkan driver manifest: $ICD"
          export ICD
          tools/host_test/run_host_tests.sh

      - name: Upload host test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-logs-${{ github.run_id }}
          path: build-host/*.log
          if-no-files-found: ignore
          retention-days: 7

  ui-screenshots:
    # Emulator screenshots of the Block 5 UI (debug-only demo route). Not a
    # device test: emulator, SwiftShader rendering, no stylus. Published as an
    # artifact and on the "ci-screenshots" branch (one orphan commit, force-
    # pushed) so they can be viewed without downloading artifacts.
    name: UI screenshots (emulator)
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK built by this run
        uses: actions/download-artifact@v4
        with:
          pattern: PxPaint-debug-apk-*
          merge-multiple: true
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on an Android 14 emulator (x86_64, Pixel 6 profile)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/ci/ui_screenshots.sh "$(ls apk/*.apk | head -1)" screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          path: screenshots
          retention-days: 30

      - name: Publish to the ci-screenshots branch
        run: |
          set -euo pipefail
          cd screenshots
          git init -q
          git checkout -q -b ci-screenshots
          echo "Emulator screenshots for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.txt
          git add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "UI screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
